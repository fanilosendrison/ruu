name: Qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualification:
    name: Normative qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Seal immutable snapshot permissions
        run: chmod -R a-w qualification/releases/adr-080-flat

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Require supported Git
        run: python3 tools/replay-git-smokes.py --check-version

      - name: Validate maintained Python and JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py tools/qualification/*.py tools/tests/*.py
          python3 -m json.tool qualification/lineage/lineage-v2.schema.json >/dev/null
          python3 -m json.tool qualification/state-space/post-baseline/qualification-metadata-v1.schema.json >/dev/null

      - name: Regenerate retained lineage
        run: python3 tools/generate-qualification-lineage.py

      - name: Regenerate active manifest
        run: python3 tools/generate-current-manifest.py

      - name: Require committed generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            printf '%s\n' "Generated artifacts are not fully committed." >&2
            exit 1
          fi

      - name: Verify qualification layout
        run: python3 tools/verify-qualification-layout.py

      - name: Verify Markdown links
        run: python3 tools/verify-markdown-links.py

      - name: Test qualification infrastructure
        run: python3 tools/tests/test-qualification-infrastructure.py

      - name: Replay latest retained state-space checkpoint
        run: python3 tools/replay-historical-qualification.py latest

      - name: Replay post-baseline state-space qualifications
        run: python3 tools/replay-post-baseline-qualification.py

      - name: Replay Git smoke suites
        run: python3 tools/replay-git-smokes.py

      - name: Check patch whitespace
        run: git diff --check
