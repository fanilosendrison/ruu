name: Qualification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualification:
    name: Normative qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Seal immutable snapshot permissions
        run: chmod -R a-w qualification/releases/adr-080-flat

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install validation dependencies
        run: |
          python3 -m pip install --requirement requirements.txt
          python3 -m pip check

      - name: Verify exact proto-ring provider pin
        run: python3 tools/check-proto-ring-provider.py

      - name: Require supported Git
        run: python3 tools/replay-git-smokes.py --check-version

      - name: Check Repository Integrity
        run: python3 tools/check-repository-integrity.py

      - name: Replay latest retained state-space checkpoint
        run: python3 tools/replay-historical-qualification.py latest

      - name: Replay post-baseline state-space qualifications
        run: python3 tools/replay-post-baseline-qualification.py

      - name: Replay Git smoke suites
        run: python3 tools/replay-git-smokes.py

      - name: Check Git whitespace
        run: git diff --check
